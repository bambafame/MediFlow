services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediflow
      POSTGRES_USER: mediflow_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mediflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow_user -d mediflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./mediflow-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediflow
      DB_USERNAME: mediflow_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RECEPTIONIST_USERNAME: ${RECEPTIONIST_USERNAME}
      RECEPTIONIST_PASSWORD: ${RECEPTIONIST_PASSWORD}
      RECEPTIONIST_EMAIL: ${RECEPTIONIST_EMAIL}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
    expose:
      - "8090"

  frontend:
    build:
      context: ./mediflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mediflow_postgres_data: