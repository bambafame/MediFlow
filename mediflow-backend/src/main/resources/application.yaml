spring:
  application:
    name: mediflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow
    username: mediflow_user
    password: mediflow_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080